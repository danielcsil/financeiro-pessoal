[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financeiro-pessoal"
version = "1.0.0"
description = "Sistema inteligente para gestão, planejamento e análise financeira pessoal."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Daniel Cunha da Silva" }
]

license = { text = "MIT" }

keywords = [
    "finance",
    "personal-finance",
    "financial-planning",
    "cash-flow",
    "ddd",
    "clean-architecture",
    "fastapi",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]

dependencies = [
    # API
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",

    # Banco de Dados
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.4",
    "psycopg[binary]>=3.2.9",

    # Configuração
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",

    # Segurança
    "bcrypt>=4.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",

    # Upload de arquivos
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "black>=25.1.0",
    "ruff>=0.12.7",
    "isort>=6.0.1",
    "mypy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/danielcunha/financeiro-pessoal"
Repository = "https://github.com/danielcunha/financeiro-pessoal"
Issues = "https://github.com/danielcunha/financeiro-pessoal/issues"

[tool.pytest.ini_options]
pythonpath = [
    "."
]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html"
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = []

[tool.mypy]
python_version = "3.12"

strict = true

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

disallow_untyped_defs = true
disallow_any_generics = false

ignore_missing_imports = true